<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Perma</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;500;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <span class="logo">PERMA</span>
</header>

<section class="hero">
    <h1>Made to last.</h1>
    <p>Longer than you think.</p>
</section>

<section class="shop">
    <h2>The collection</h2>
    <div id="grid" class="grid"></div>
</section>

<script>
    fetch('products.json')
        .then(r => r.json())
        .then(products => {
            const grid = document.getElementById('grid');

            grid.innerHTML = products.map(p => `
        <article class="card">
          <div class="picture">
            <div class="label">
              <p class="label-title">Perma · care &amp; content</p>
              <dl>
                <dt>Content</dt>
                <dd>${p.content}</dd>
                <dt>Finish <span class="chip">PFAS</span></dt>
                <dd>${p.finish}</dd>
                <dt>Wash</dt>
                <dd>${p.wash}</dd>
                <dt>Afterwards</dt>
                <dd>${p.afterwards}</dd>
              </dl>
            </div>
          </div>
          <h3>${p.name}</h3>
          <p class="category">${p.category}</p>
          <p class="price">€${p.price}</p>
          <button class="flip" type="button">Read the label</button>
        </article>
      `).join('');

            grid.addEventListener('click', e => {
                const btn = e.target.closest('.flip');
                if (!btn) return;
                const card = btn.closest('.card');
                const open = card.classList.toggle('flipped');
                btn.textContent = open ? 'Back' : 'Read the label';
            });
        });
</script>

</body>
</html>
