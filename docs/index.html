<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Perma</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <a class="logo" href="index.html">PERMA</a>
    <nav>
        <a href="index.html#collection">Shop</a>
        <a href="learn.html">The label</a>
    </nav>
</header>

<section class="hero">
    <h1>Made to last.</h1>
    <p>Longer than you think.</p>
    <div class="beads" aria-hidden="true">
        <span class="bead" style="--s:88px;--x:72%;--y:12%;--d:.1s"></span>
        <span class="bead" style="--s:48px;--x:84%;--y:26%;--d:.35s"></span>
        <span class="bead" style="--s:128px;--x:78%;--y:44%;--d:.2s"></span>
        <span class="bead" style="--s:36px;--x:66%;--y:58%;--d:.55s"></span>
        <span class="bead" style="--s:64px;--x:90%;--y:70%;--d:.45s"></span>
        <span class="bead" style="--s:26px;--x:93%;--y:10%;--d:.7s"></span>
        <span class="bead" style="--s:44px;--x:71%;--y:80%;--d:.3s"></span>
    </div>
</section>

<section id="collection" class="shop">
    <h2>Everyday</h2>
    <div id="grid-everyday" class="grid"></div>
</section>

<svg class="ridge" viewBox="0 0 1200 120" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 120 L0 70 L180 20 L300 60 L460 0 L640 70 L800 30 L980 80 L1100 40 L1200 70 L1200 120 Z" fill="#0E1C28"/>
</svg>

<section id="alpine" class="shop drop">
    <p class="drop-tag">Drop 01</p>
    <h2>Alpine</h2>
    <p class="drop-lede">Our ski collection, it uses the same water-repellent finish as the pieces above</p>
    <div id="grid-alpine" class="grid"></div>
</section>

<footer>
    <p>Perma is a fictional brand, made for a university assignment about PFAS. Nothing here can be bought.</p>
</footer>

<script src="js/art.js"></script>
<script>
    function card(p) {
        return `
        <article class="card">
          <div class="picture">
            ${garment(p.id)}
            <div class="label">
              <p class="label-title">Perma · care &amp; content</p>
              <dl>
                <dt>Content</dt>
                <dd>${p.content}</dd>
                <dt>${p.finishLabel || 'Finish'} <span class="chip">PFAS</span></dt>
                <dd>${p.finish}</dd>
                <dt>${p.washLabel || 'Wash'}</dt>
                <dd>${p.wash}</dd>
                <dt>Afterwards</dt>
                <dd>${p.afterwards}</dd>
              </dl>
            </div>
          </div>
          <h3><a href="product.html?id=${p.id}">${p.name}</a></h3>
          <p class="category">${p.category}</p>
          <p class="price">€${p.price}</p>
          <button class="flip" type="button">Read the label</button>
        </article>`;
    }

    fetch('products.json')
        .then(r => r.json())
        .then(products => {
            const show = (gridId, name) => {
                document.getElementById(gridId).innerHTML =
                    products.filter(p => p.collection === name).map(card).join('');
            };
            show('grid-everyday', 'everyday');
            show('grid-alpine', 'alpine');
        });

    document.addEventListener('click', e => {
        const btn = e.target.closest('.flip');
        if (!btn) return;
        const open = btn.closest('.card').classList.toggle('flipped');
        btn.textContent = open ? 'Back' : 'Read the label';
    });
</script>

</body>
</html>
