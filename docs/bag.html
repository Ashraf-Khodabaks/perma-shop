<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your bag - Perma</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/avoid.css">
</head>
<body>

<header>
  <a class="logo" href="index.html">PERMA</a>
  <nav>
    <a href="index.html#collection">Shop</a>
    <a href="materials.html">Materials</a>
    <a href="learn.html">The label</a>
    <a href="bag.html" aria-current="page">Bag (<span data-bag-count>0</span>)</a>
  </nav>
</header>

<main class="bag-page">
  <h1>Your bag</h1>
  <div class="bag-layout">
    <div id="lines"></div>
    <aside id="meter" class="meter-card"></aside>
  </div>
</main>

<footer>
  <p>Perma is a fictional brand, made for a university assignment about PFAS. Nothing here can be bought.</p>
</footer>

<script src="js/art.js"></script>
<script src="js/bag.js"></script>
<script src="js/avoid.js"></script>
<script>
  const MAX = 12;
  let products = [];

  function levelFor(score) {
    if (score === 0) {
      return { key: 'none', name: 'Nothing yet',
        text: 'Add something to your bag to see what you avoid.' };
    }
    if (score <= 3) {
      return { key: 'low', name: 'Low',
        text: 'You avoid a few product types where PFAS are common or still unknown. Everything in your bag is made without intentionally added PFAS, so those finishes stay out of your wardrobe and your washing machine.' };
    }
    if (score <= 8) {
      return { key: 'medium', name: 'Medium',
        text: 'Several items in your bag are product types where tests found PFAS. Finishes like these wear off in the wash, and wastewater plants can’t break PFAS down, so they end up in rivers, seas and groundwater. Yours won’t add to that.' };
    }
    return { key: 'high', name: 'High',
      text: 'Most of your bag is product types where PFAS are common. That is a lot of finish that never enters your wardrobe, your washing machine or the wastewater. PFAS have been found in drinking water sources, wildlife and people’s blood worldwide, and some are linked to health effects. The worry is the build-up across many products and many people.' };
  }

  function render() {
    const items = Bag.read();
    const lines = document.getElementById('lines');
    const meter = document.getElementById('meter');

    let total = 0;
    let score = 0;
    const evidence = { strong: 0, moderate: 0, weak: 0 };

    if (items.length === 0) {
      lines.innerHTML = '<p>Your bag is empty. <a href="index.html#collection">Back to the collection</a></p>';
    } else {
      lines.innerHTML = items.map((it, i) => {
        const p = products.find(x => x.id === it.id);
        if (!p) return '';

        const color = p.colors?.find(c => c.id === it.colorId) || p.colors?.[0];
        const image = color?.image || p.views?.[0]?.image;
        const a = avoidFor(p.id);

        total += p.price;
        score += LEVELS[a.level].points;
        evidence[a.evidence]++;

        return `
          <article class="line">
            <div class="thumb">${garment(p.id, image)}</div>
            <div class="line-info">
              <h3>${p.name}</h3>
              <p class="category">${p.category}${color ? ' · ' + color.name : ''}</p>
              <p class="avoid-line"><strong>You avoid:</strong> ${a.avoid}</p>
              <p class="avoid-line"><span class="chip ${a.level}">Level: ${LEVELS[a.level].name}</span> ${evBadge(a)}</p>
              <div class="line-actions">
                <button type="button" class="link" data-act="remove" data-i="${i}">Remove</button>
              </div>
            </div>
            <p class="price">€${p.price}</p>
          </article>`;
      }).join('') + `<div class="total"><span>Total</span><span>€${total}</span></div>`;
    }

    const lv = levelFor(score);
    const pct = Math.min(score / MAX, 1) * 100;

    meter.innerHTML = `
      <h2>PFAS avoided</h2>
      <div class="gauge" data-level="${lv.key}"><div class="gauge-fill"></div></div>
      <div class="gauge-scale"><span>None</span><span>Low</span><span>Medium</span><span>High</span></div>
      <p class="level">${lv.name}</p>
      <p>${lv.text}</p>
      ${items.length ? `<p class="evidence-count">Evidence behind this score: ${evidence.strong} strong, ${evidence.moderate} moderate, ${evidence.weak} weak.</p>` : ''}
      <p class="fine">This meter is an illustration, not a measurement of your exposure. A product type scores 3 if tests found PFAS in conventional versions, and 1 if we found no evidence either way. “Unknown” means no tests were found, not that the product type is safe. “${CLAIM}” is not a guarantee of zero traces. See <a href="materials.html">our materials</a> and <a href="learn.html#sources">the sources</a>.</p>
    `;

    requestAnimationFrame(() => requestAnimationFrame(() => {
      meter.querySelector('.gauge-fill').style.width = pct + '%';
    }));
  }

  document.getElementById('lines').addEventListener('click', e => {
    const b = e.target.closest('button[data-act]');
    if (!b) return;
    if (b.dataset.act === 'remove') Bag.remove(Number(b.dataset.i));
    updateBagCount();
    render();
  });

  fetch('products.json')
          .then(r => r.json())
          .then(data => { products = data; render(); });
</script>

</body>
</html>
