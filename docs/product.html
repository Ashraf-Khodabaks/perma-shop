<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product - Perma</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/avoid.css">
</head>
<body>

<header>
    <a class="logo" href="index.html">PERMA</a>
    <nav>
        <a href="index.html#collection">Shop</a>
        <a href="materials.html">Materials</a>
        <a href="learn.html">The label</a>
        <a href="bag.html">Bag (<span data-bag-count>0</span>)</a>
    </nav>
</header>

<main id="product" class="product">
    <p>Loading...</p>
</main>

<footer>
    <p>Perma is a fictional brand, made for a university assignment about PFAS. Nothing here can be bought.</p>
</footer>

<script src="js/art.js"></script>
<script src="js/bag.js"></script>
<script src="js/avoid.js"></script>
<script>
    const id = new URLSearchParams(location.search).get('id');
    const root = document.getElementById('product');

    fetch('products.json')
        .then(r => r.json())
        .then(products => {

            const p = products.find(x => x.id === id);

            if (!p) {
                root.innerHTML = '<p>Product not found. <a href="index.html#collection">Back to the collection</a></p>';
                return;
            }

            document.title = p.name + ' - Perma';

            if (p.collection === 'alpine') {
                document.body.classList.add('alpine');
            }

            const colors = p.colors || [];
            const views = p.views || [];
            let selectedColor = colors.length > 0 ? colors[0] : null;
            const firstImage = selectedColor?.image || views[0]?.image || null;
            const a = avoidFor(p.id);

            root.innerHTML = `
                <div class="stage-col">
                    <div class="stage">
                        ${garment(p.id, firstImage)}
                    </div>

                    ${views.length > 1 ? `
                        <div class="views">
                            ${views.map((v, i) => `
                                <button type="button"
                                        class="view-thumb ${i === 0 ? 'selected' : ''}"
                                        data-image="${v.image}"
                                        aria-label="${v.name}"
                                        title="${v.name}">
                                    <img src="${v.image}" alt="${v.name} view">
                                </button>
                            `).join('')}
                        </div>
                    ` : ''}
                </div>

                <div class="info">

                    <a class="crumb" href="index.html#collection">Back to the collection</a>

                    <h1>${p.name}</h1>

                    <p class="price">€${p.price}</p>

                    <p>${p.description}</p>

                    ${colors.length > 0 ? `
                        <div class="color-section">
                            <h3>Color</h3>
                            <div class="color-options">
                                ${colors.map(color => `
                                    <button type="button"
                                        class="color-option ${color.id === selectedColor.id ? 'selected' : ''}"
                                        data-color="${color.id}"
                                        style="--color: ${color.hex}"
                                        aria-label="${color.name}"
                                        title="${color.name}">
                                    </button>
                                `).join('')}
                            </div>
                            <p id="selected-color">${selectedColor.name}</p>
                        </div>
                    ` : ''}

                    <button class="add" type="button">Add to bag</button>

                    <h2>The label</h2>

                    <div class="tag">
                        ${labelInner(p)}
                    </div>

                    <h2>Why you avoid it</h2>

                    <div class="evidence">
                        <div class="meta-line">
                            <span class="chip ${a.level}">Level: ${LEVELS[a.level].name}</span>
                            ${evBadge(a)}
                        </div>
                        <p>${a.avoid}</p>
                        ${a.amount ? `<p><strong>Measured:</strong> ${a.amount}</p>` : ''}
                        <p class="small"><strong>Basis:</strong> ${a.basis}</p>
                        <p class="small">Level shows how often PFAS were found in conventional versions of this product. “Unknown” means we found no tests, not that it is safe. See <a href="learn.html#sources">the sources</a> and <a href="materials.html">our materials</a>.</p>
                    </div>

                </div>
            `;

            // Kleur kiezen
            root.querySelectorAll('.color-option').forEach(button => {
                button.addEventListener('click', () => {
                    selectedColor = colors.find(c => c.id === button.dataset.color);

                    const photo = root.querySelector('.stage img');
                    if (photo) photo.src = selectedColor.image;

                    root.querySelectorAll('.color-option').forEach(b => b.classList.remove('selected'));
                    button.classList.add('selected');
                    root.querySelector('#selected-color').textContent = selectedColor.name;
                });
            });

            // Voorkant / achterkant kiezen
            root.querySelectorAll('.view-thumb').forEach(button => {
                button.addEventListener('click', () => {
                    const photo = root.querySelector('.stage img');
                    if (photo) photo.src = button.dataset.image;

                    root.querySelectorAll('.view-thumb').forEach(b => b.classList.remove('selected'));
                    button.classList.add('selected');
                });
            });

            // Toevoegen aan tas
            root.querySelector('.add').addEventListener('click', () => {
                Bag.add(p.id, selectedColor?.id);
                updateBagCount();
                toast('Added to your bag');
            });
        });
</script>

</body>
</html>
