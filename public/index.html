<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Perma</title>
</head>
<body>
<h1>Perma</h1>
<div id="grid"></div>
<script>
    fetch('/api/products')
        .then(r => r.json())
        .then(products => {
            const grid = document.getElementById('grid');
            grid.innerHTML = products.map(p => `
        <div>
          <h2>${p.name}</h2>
          <p>${p.category} - €${p.price}</p>
          <p>${p.description}</p>
        </div>
      `).join('');
        });
</script>
</body>
</html>
